<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.9"/>

  <!-- Outer Shield Badge with Glow -->
  <path d="M256 76 L396 138 C396 270 340 376 256 428 C172 376 116 270 116 138 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Shield Surface -->
  <path d="M256 102 L372 154 C372 264 326 352 256 398 C186 352 140 264 140 154 Z" fill="url(#innerShield)"/>

  <!-- Star of Excellence at Top -->
  <path d="M256 134 L264 158 L288 158 L268 172 L276 196 L256 182 L236 196 L244 172 L224 158 L248 158 Z" fill="#FBBF24"/>

  <!-- AWS Certification Letters / Emblem -->
  <text x="256" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    AWS
  </text>

  <text x="256" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="6">
    EXAM PREP
  </text>

  <!-- Golden Checkmark Circle -->
  <circle cx="256" cy="344" r="30" fill="#10B981"/>
  <path d="M244 344 L252 352 L268 336" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
